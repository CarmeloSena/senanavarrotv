<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Launcher Familia Sena</title>
<style>
  :root{
    --bg1:#0b1430; --bg2:#13254f; --txt:#f3f5fb; --muted:#9fb0d6;
    --focus:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg1);
    font-family:"Samsung One","SamsungOne","Helvetica Neue",Arial,sans-serif;color:var(--txt)}
  body{transform-origin:0 0}
  #bg{position:absolute;inset:0;background:
      radial-gradient(1200px 700px at 80% 10%, #2a4a9a55, transparent 60%),
      radial-gradient(900px 600px at 10% 90%, #7a3fa044, transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg2));}
  .screen{position:absolute;inset:0;padding:70px 110px;display:none;flex-direction:column}
  .screen.active{display:flex}

  /* Barra superior: hora, fecha, tiempo */
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  .clock{font-size:150px;font-weight:200;letter-spacing:-4px;line-height:1}
  .date{font-size:40px;color:var(--muted);margin-top:10px;text-transform:capitalize}
  .weather{display:flex;align-items:center;gap:26px;text-align:right}
  .weather .icon{font-size:110px;line-height:1}
  .weather .temp{font-size:80px;font-weight:300}
  .weather .desc{font-size:30px;color:var(--muted)}
  .weather .tomorrow{font-size:26px;color:var(--muted);margin-top:6px}
  .logo{position:absolute;right:60px;bottom:40px;width:70px;height:70px;border-radius:14px;
    background:#1b2d5e;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:30px;color:#fff;opacity:.55;letter-spacing:-2px}

  /* Perfiles */
  h1{font-size:56px;font-weight:300;margin:70px 0 50px;text-align:center}
  .profiles{display:flex;justify-content:center;gap:60px}
  .profile{width:260px;text-align:center;transition:transform .15s}
  .avatar{width:260px;height:260px;border-radius:40px;display:flex;align-items:center;
    justify-content:center;font-size:120px;font-weight:600;border:6px solid transparent;
    box-shadow:0 20px 50px #0007;transition:all .15s}
  .profile .name{font-size:40px;margin-top:24px;color:var(--muted);transition:color .15s}
  .profile.focus{transform:scale(1.1)}
  .profile.focus .avatar{border-color:var(--focus)}
  .profile.focus .name{color:#fff;font-weight:600}

  /* Apps */
  .greet{font-size:52px;font-weight:300;margin:40px 0 18px}
  .phrase{font-size:44px;font-weight:500;background:#ffffff14;border-left:10px solid #ffd257;
    padding:26px 36px;border-radius:18px;margin-bottom:34px;max-width:1500px}
  .apps{display:grid;gap:36px;margin-top:10px;justify-content:center}
  .app{height:var(--alto,210px);border-radius:30px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;font-size:var(--letra,38px);font-weight:600;border:6px solid transparent;
    box-shadow:0 18px 40px #0006;transition:transform .15s,border-color .15s}
  .app .ico{font-size:var(--ico,72px);line-height:1}
  .app.focus{transform:scale(1.08);border-color:var(--focus)}
  .hint{position:absolute;left:110px;bottom:40px;font-size:26px;color:var(--muted)}

  #toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);
    background:#000c;padding:24px 44px;border-radius:20px;font-size:36px;display:none}
</style>
</head>
<body>
<div id="bg"></div>

<!-- PANTALLA 1: ¿Quién está viendo? -->
<section id="s-profiles" class="screen active">
  <div class="top">
    <div><div class="clock" id="clock1">--:--</div><div class="date" id="date1"></div></div>
    <div class="weather" id="weather1"></div>
  </div>
  <h1>¿Quién va a ver la tele?</h1>
  <div class="profiles" id="profiles"></div>
  <div class="hint">◀ ▶ elegir · OK entrar</div>
</section>

<!-- PANTALLA 2: botones del perfil -->
<section id="s-apps" class="screen">
  <div class="top">
    <div><div class="clock" id="clock2" style="font-size:110px">--:--</div><div class="date" id="date2"></div></div>
    <div class="weather" id="weather2"></div>
  </div>
  <div class="greet" id="greet"></div>
  <div class="phrase" id="phrase" style="display:none"></div>
  <div class="apps" id="apps"></div>
  <div class="hint">Flechas para moverte · OK abrir · VOLVER cambiar de perfil</div>
</section>

<div class="logo">CS</div>
<div id="toast"></div>
<div id="aviso" style="display:none;position:absolute;inset:0;background:#0b1430ee;color:#fff;
  font-size:64px;font-weight:600;text-align:center;align-items:center;justify-content:center;
  padding:0 160px;line-height:1.3"></div>
<pre id="diag" style="display:none;position:absolute;inset:60px;background:#000e;color:#9f9;
  font-size:24px;padding:40px;overflow:auto;border-radius:20px;white-space:pre-wrap"></pre>

<script>
/* =====================================================================
   CONFIGURACIÓN — todo lo que se puede cambiar está aquí
   ===================================================================== */
var CONFIG = {
  ciudad: { nombre: "Valencia", lat: 39.4699, lon: -0.3763 },
  // Home Assistant: recibe las órdenes y se las da a la tele
  homeAssistant: "http://192.168.1.111:8123/api/webhook/inicio_familia_tv",

  // Catálogo de botones. appId = identificador de la app en la tele
  // (los rellenamos con los reales cuando lo instalemos).
  apps: {
    tizentube: { nombre:"YouTube",     ico:"▶",  color:"#c4302b", appId:"TIZENTUBE" },
    netflix:   { nombre:"Netflix",     ico:"N",  color:"#141414", appId:["3201907018807"] },
    disney:    { nombre:"Disney+",     ico:"✦",  color:"#0e2a6b", appId:["3201901017640"] },
    hbo:       { nombre:"HBO Max",     ico:"◆",  color:"#3b1d8f", appId:["3201601007230"] },
    prime:     { nombre:"Prime Video", ico:"⌁",  color:"#00a8e1", appId:["3201910019365"] },
    tdt:       { nombre:"TDT",         ico:"📺", color:"#1f6f50", fuente:"digital_tv" },
    jellyfin:  { nombre:"Jellyfin",    ico:"🎞", color:"#6b3fa0", modulo:"npm/@elfpie/jellyfin-tizen", ruta:"index.html" },
    hdmimm:    { nombre:"HDMI Multimedia", ico:"🔌", color:"#44536e", fuente:"hdmi2" },
    switch:    { nombre:"Switch",      ico:"🕹", color:"#e60012", fuente:"hdmi2",
                 aviso:"Si la Switch está apagada, despiértala con el botón HOME del mando 🕹️" },
    chromecast:{ nombre:"Chromecast",  ico:"📡", color:"#4285f4", fuente:"hdmi1" },
    ps4:       { nombre:"PlayStation 4",ico:"🎮",color:"#003791", fuente:"hdmi3",
                 aviso:"Si la PlayStation está apagada, enciéndela con el botón PS del mando 🎮" }
  },

  perfiles: [
    { id:"familia", nombre:"Familia", color:"#1f9e9e", inicial:"👨‍👩‍👧‍👦",
      apps:["tdt","netflix","tizentube","jellyfin","hdmimm"] },
    { id:"carmelo", nombre:"Carmelo", color:"#2f6fd6", inicial:"C",
      apps:["tizentube","netflix","disney","hbo","prime","tdt","jellyfin","hdmimm","ps4","chromecast"] },
    { id:"mara",    nombre:"Mara",    color:"#c2477e", inicial:"M",
      apps:["tdt","netflix","tizentube","hdmimm"] },
    { id:"laura",   nombre:"Laura",   color:"#8a4fd8", inicial:"L", peque:true,
      apps:["tizentube","netflix","disney","tdt"] },
    { id:"pablo",   nombre:"Pablo",   color:"#f07a1a", inicial:"P", peque:true,
      apps:["ps4","tizentube","netflix","disney","tdt","switch"] }
  ],

  // Frases para los peques. Grupos de frases + horario que las activa.
  frases: {
    manana:   ["¿Desayunado y mochila lista? ¡Que no se te haga tarde! 🎒",
               "¡Buenos días! Hoy va a ser un gran día ☀️"],
    cole:     ["¿No deberías estar en clase? 😄",
               "Si estás en casa, aprovecha para repasar un poco 📚"],
    descanso: ["Un rato de descanso y luego, a los deberes 📚",
               "Disfruta del descanso, que luego toca estudiar 😉"],
    guitarra: ["¿Has tocado ya la guitarra hoy? 🎸",
               "Un ratito de guitarra y luego, a disfrutar 🎵",
               "Los grandes músicos practican un poco cada día. ¿Has tocado ya? 🎸"],
    estudio:  ["¿Has estudiado o repasado ya? Recuerda hacerlo antes de ponerte a ver la tele 📚",
               "¿Deberes hechos? Si la respuesta es sí, ¡adelante! ✅",
               "Diez minutos de repaso ahora valen por una hora el día del examen.",
               "Primero la obligación, luego la diversión 😉"],
    cena:     ["¿Has preparado la mochila para mañana? 🎒",
               "¿Has ayudado a poner la mesa? 💛",
               "¿Has recogido tu habitación? 🧹"],
    dormir:   ["Ya es tarde… mejor un capítulo y a la cama 🌙",
               "Mañana hay que madrugar. ¡A descansar pronto! 😴"],
    finde_manana: ["¡Es finde! ¿Y si salimos a dar una vuelta antes de la tele? ☀️",
                   "¿Sabías que el pulpo tiene tres corazones? 🐙",
                   "¿Sabías que la guitarra española moderna nació en el siglo XIX? 🎸"],
    finde_tarde:  ["¿Y si hoy jugamos todos a algo? 🎲",
                   "¿Has tocado un ratito la guitarra este finde? 🎸",
                   "Lo has hecho genial esta semana. ¡Te lo has ganado! 🌟"],
    domingo_tarde:["Mañana es lunes: ¿deberes y mochila listos? ✅",
                   "Buen finde. Mañana toca madrugar 🌙"]
  }
};

/* Elige el grupo de frases según día y hora */
function grupoFrases(d){
  var dia=d.getDay(), h=d.getHours()+d.getMinutes()/60;
  var esFinde = dia===0 || dia===6 || (dia===5 && h>=17);
  if(esFinde){
    if(dia===0 && h>=18) return ["domingo_tarde"];
    if(h<14) return ["finde_manana"];
    return ["finde_tarde"];
  }
  if(h>=7 && h<9)   return ["manana"];
  if(h>=9 && h<14)  return ["cole"];
  if(h>=14 && h<17) return ["descanso","guitarra"];
  if(h>=17 && h<20.5) return Math.random()<0.33 ? ["guitarra"] : ["estudio"];
  if(h>=20.5 && h<22) return ["cena"];
  return ["dormir"];
}
function fraseAleatoria(){
  var grupos=grupoFrases(new Date()), todas=[];
  grupos.forEach(function(g){ todas=todas.concat(CONFIG.frases[g]); });
  return todas[Math.floor(Math.random()*todas.length)];
}

/* =====================================================================
   HORA, FECHA Y TIEMPO
   ===================================================================== */
function tick(){
  var d=new Date();
  var hora=d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  var fecha=d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
  ["1","2"].forEach(function(n){
    document.getElementById("clock"+n).textContent=hora;
    document.getElementById("date"+n).textContent=fecha;
  });
}
var WMO={0:["☀️","Despejado"],1:["🌤","Casi despejado"],2:["⛅","Nubes y claros"],3:["☁️","Nublado"],
  45:["🌫","Niebla"],48:["🌫","Niebla"],51:["🌦","Llovizna"],53:["🌦","Llovizna"],55:["🌧","Llovizna"],
  61:["🌧","Lluvia débil"],63:["🌧","Lluvia"],65:["🌧","Lluvia fuerte"],80:["🌦","Chubascos"],
  81:["🌧","Chubascos"],82:["⛈","Chubascos fuertes"],95:["⛈","Tormenta"],96:["⛈","Tormenta"],99:["⛈","Tormenta"]};
function wmo(c){ return WMO[c]||["🌡",""]; }
function loadWeather(){
  var c=CONFIG.ciudad;
  var url="https://api.open-meteo.com/v1/forecast?latitude="+c.lat+"&longitude="+c.lon+
    "&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FMadrid&forecast_days=2";
  fetch(url).then(function(r){return r.json();}).then(function(j){
    var now=wmo(j.current.weather_code), tm=wmo(j.daily.weather_code[1]);
    var html='<div><div class="temp">'+Math.round(j.current.temperature_2m)+'°</div>'+
      '<div class="desc">'+c.nombre+' · '+now[1]+'</div>'+
      '<div class="tomorrow">Mañana '+tm[0]+' '+Math.round(j.daily.temperature_2m_min[1])+'° / '+
      Math.round(j.daily.temperature_2m_max[1])+'°</div></div><div class="icon">'+now[0]+'</div>';
    document.getElementById("weather1").innerHTML=html;
    document.getElementById("weather2").innerHTML=html;
  }).catch(function(){
    var f='<div class="desc">'+c.nombre+' · sin datos del tiempo</div>'; document.getElementById("weather1").innerHTML=f; document.getElementById("weather2").innerHTML=f;
  });
}

/* =====================================================================
   PANTALLAS Y NAVEGACIÓN CON EL MANDO
   ===================================================================== */
var state={screen:"profiles", pIdx:0, aIdx:0, perfil:null};

function renderProfiles(){
  var box=document.getElementById("profiles"); box.innerHTML="";
  CONFIG.perfiles.forEach(function(p,i){
    var el=document.createElement("div");
    el.className="profile"+(i===state.pIdx?" focus":"");
    el.innerHTML='<div class="avatar" style="background:'+p.color+'">'+p.inicial+'</div><div class="name">'+p.nombre+'</div>';
    box.appendChild(el);
  });
}
function renderApps(){
  var p=state.perfil, box=document.getElementById("apps"); box.innerHTML="";
  var n=p.apps.length;
  COLS = n<=5 ? n : (n<=8 ? 4 : 5);
  var ancho = COLS===5 ? 300 : 360, alto = n>8 ? 175 : 200;
  box.style.gridTemplateColumns="repeat("+COLS+","+ancho+"px)";
  box.style.setProperty("--alto",alto+"px");
  box.style.setProperty("--ico",(n>8?60:72)+"px");
  box.style.setProperty("--letra",(n>8?32:38)+"px");
  p.apps.forEach(function(k,i){
    var a=CONFIG.apps[k], el=document.createElement("div");
    el.className="app"+(i===state.aIdx?" focus":"");
    el.style.background=a.color;
    el.innerHTML='<div class="ico">'+a.ico+'</div><div>'+a.nombre+'</div>';
    box.appendChild(el);
  });
}
function saludo(){
  var h=new Date().getHours();
  return h<6?"Buenas noches":(h<14?"Buenos días":(h<21?"Buenas tardes":"Buenas noches"));
}
function enterProfile(){
  state.perfil=CONFIG.perfiles[state.pIdx]; state.aIdx=0; state.screen="apps";
  document.getElementById("greet").textContent=
    state.perfil.id==="familia" ? saludo()+", familia 👋" : saludo()+", "+state.perfil.nombre+" 👋";
  var ph=document.getElementById("phrase");
  if(state.perfil.peque){ ph.textContent=fraseAleatoria(); ph.style.display="block"; }
  else ph.style.display="none";
  show("s-apps"); renderApps();
}
function show(id){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});
  document.getElementById(id).classList.add("active");
}
function toast(t){
  var el=document.getElementById("toast"); el.textContent=t; el.style.display="block";
  clearTimeout(el._t); el._t=setTimeout(function(){el.style.display="none";},2000);
}
/* Lanzar apps desde dentro de TizenBrew */
var ULTIMO_ERROR="";
function probarIds(ids, i, nombre){
  if(i>=ids.length){ toast("No he podido abrir "+nombre); return; }
  try{
    tizen.application.launch(ids[i], function(){}, function(err){
      ULTIMO_ERROR=nombre+" "+ids[i]+": "+err.message; probarIds(ids,i+1,nombre);
    });
  }catch(e){ ULTIMO_ERROR=nombre+" "+ids[i]+": "+e.message; probarIds(ids,i+1,nombre); }
}
/* YouTube: le pedimos a TizenBrew que abra su módulo TizenTube */
function abrirTizenTube(){
  fetch("https://cdn.jsdelivr.net/npm/@foxreis/tizentube/package.json")
  .then(function(r){return r.json();}).then(function(p){
    var mod={ fullName:"npm/@foxreis/tizentube", name:"@foxreis/tizentube", appName:p.appName,
      appPath:p.websiteURL, keys:p.keys||[], moduleType:"npm", packageType:p.packageType,
      serviceFile:p.serviceFile, mainFile:p.main, tizenAppId:p.tizenAppId,
      evaluateScriptOnDocumentStart:p.evaluateScriptOnDocumentStart };
    (mod.keys).forEach(function(k){ try{ tizen.tvinputdevice.registerKey(k); }catch(e){} });
    var ws=new WebSocket("ws://localhost:8081");
    ws.onopen=function(){
      ws.send(JSON.stringify({type:5, payload:mod}));
      setTimeout(function(){ location.href=mod.appPath; },300);
    };
    ws.onerror=function(){ toast("No he podido hablar con TizenBrew"); };
  }).catch(function(){ toast("Sin conexión para abrir YouTube"); });
}
/* Las órdenes van a Home Assistant, que es quien manda a la tele
   (la tele no obedece órdenes que salen de ella misma). */
function pedirHA(params, nombre){
  var url=CONFIG.homeAssistant+"?"+params+"&t="+Date.now();
  fetch(url,{method:"GET",mode:"no-cors"}).then(function(){
    ULTIMO_ERROR="Enviado a Home Assistant: "+params;
  }).catch(function(e){
    ULTIMO_ERROR="Home Assistant no responde: "+e.message;
    toast("Home Assistant no responde");
  });
  if(nombre) toast("Abriendo "+nombre+"…");
}
function pulsarTecla(k){ pedirHA("accion=tecla&tecla="+encodeURIComponent(k)); }
function abrirPorNumero(ids, nombre){ pedirHA("accion=app&id="+encodeURIComponent(ids[0]), nombre); }
function mostrarAviso(texto){
  var el=document.getElementById("aviso");
  el.textContent=texto; el.style.display="flex";
  clearTimeout(el._t); el._t=setTimeout(function(){ el.style.display="none"; },9000);
}
/* Abre otro módulo de TizenBrew (p. ej. Jellyfin) dentro de la propia TizenBrew */
function abrirModulo(a){
  toast("Abriendo "+a.nombre+"…");
  location.href="http://127.0.0.1:8081/module/"+encodeURIComponent(a.modulo)+"/"+a.ruta;
}
function launch(key){
  var a=CONFIG.apps[key];
  if(a.modulo){ abrirModulo(a); return; }
  if(a.fuente){
    pedirHA("accion=fuente&fuente="+encodeURIComponent(a.fuente));
    toast(a.nombre);
    if(a.aviso) setTimeout(function(){ mostrarAviso(a.aviso); },1200);
    return;
  }
  if(a.appId==="TIZENTUBE"){ abrirTizenTube(); return; }
  if(typeof a.appId==="string" && a.appId.indexOf("KEY_")===0){ pulsarTecla(a.appId); toast(a.nombre); return; }
  if(Array.isArray(a.appId)){
    abrirPorNumero(a.appId, a.nombre);
    return;
  }
  toast(a.nombre+": todavía no sé cómo abrirlo desde aquí");
}
/* Pantalla de diagnóstico: tecla 0 */
function diagnostico(){
  var t="ÚLTIMO ERROR:\n"+(ULTIMO_ERROR||"ninguno")+"\n\nBOTONES:\n";
  Object.keys(CONFIG.apps).forEach(function(k){ t+=CONFIG.apps[k].nombre+"  →  "+(CONFIG.apps[k].fuente||CONFIG.apps[k].appId)+"\n"; });
  var d=document.getElementById("diag");
  d.textContent=t; d.style.display = d.style.display==="block" ? "none" : "block";
}

var COLS=4;
document.addEventListener("keydown",function(e){
  var k=e.keyCode;            // 37◀ 38▲ 39▶ 40▼ 13 OK  10009 VOLVER (Samsung)  8/27 Mac
  if(k===48||k===96){ diagnostico(); return; }   // tecla 0
  if(state.screen==="profiles"){
    var n=CONFIG.perfiles.length;
    if(k===39) state.pIdx=(state.pIdx+1)%n;
    else if(k===37) state.pIdx=(state.pIdx-1+n)%n;
    else if(k===13){ enterProfile(); return; }
    renderProfiles();
  } else {
    var m=state.perfil.apps.length;
    if(k===39) state.aIdx=Math.min(state.aIdx+1,m-1);
    else if(k===37) state.aIdx=Math.max(state.aIdx-1,0);
    else if(k===40) state.aIdx=Math.min(state.aIdx+COLS,m-1);
    else if(k===38) state.aIdx=Math.max(state.aIdx-COLS,0);
    else if(k===13){ launch(state.perfil.apps[state.aIdx]); return; }
    else if(k===10009||k===8||k===27){ state.screen="profiles"; show("s-profiles"); renderProfiles(); e.preventDefault(); return; }
    renderApps();
  }
});

/* Escalar a la ventana en la vista previa del navegador */
function fit(){ var s=Math.min(innerWidth/1920,innerHeight/1080);
  document.body.style.transform="scale("+s+")"; }
window.addEventListener("resize",fit);

fit(); tick(); setInterval(tick,10000); loadWeather(); setInterval(loadWeather,30*60*1000);
renderProfiles();
/* Registrar las teclas numéricas del mando (para el 0 de diagnóstico) */

</script>
</body>
</html>
